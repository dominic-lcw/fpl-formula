name: Deploy FPL Formula

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fpl-formula-production
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and lint checks
        run: |
          pnpm test
          pnpm lint

      - name: Hydrate FPL data
        run: pnpm hydrate

      - name: Build production package
        run: |
          pnpm build
          rm -rf deployment fpl-formula.zip
          mkdir deployment
          cp package.json pnpm-lock.yaml next.config.ts deployment/
          pnpm --dir deployment install --prod --frozen-lockfile --node-linker=hoisted
          cp -R .next deployment/.next
          if [ -d public ]; then cp -R public deployment/public; fi
          cp -R data deployment/data
          cd deployment
          zip -qr ../fpl-formula.zip .

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package to App Service
        run: >
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_WEBAPP_NAME }}"
          --src-path fpl-formula.zip
          --type zip
          --async true

      - name: Verify deployed service
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          health_url="https://${WEBAPP_NAME}.azurewebsites.net/api/health"
          status_url="https://${WEBAPP_NAME}.azurewebsites.net/api/status"
          rankings_url="https://${WEBAPP_NAME}.azurewebsites.net/api/rankings?minMinutes=0"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          deadline=$((SECONDS + 180))
          attempt=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            health_status="$(curl --silent --output "$temp_dir/health.json" --write-out "%{http_code}" --connect-timeout 5 --max-time 10 "$health_url" || true)"

            if [ "$health_status" = "200" ]; then
              status_code="$(curl --silent --output "$temp_dir/status.json" --write-out "%{http_code}" --connect-timeout 5 --max-time 10 "$status_url" || true)"
              rankings_code="$(curl --silent --output "$temp_dir/rankings.json" --write-out "%{http_code}" --connect-timeout 5 --max-time 10 "$rankings_url" || true)"

              if [ "$status_code" = "200" ] && [ "$rankings_code" = "200" ] && node -e '
                const fs = require("node:fs");
                const status = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const rankings = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                if (status.latest?.status !== "complete" || rankings.rankings?.length < 1) {
                  throw new Error("FPL data is incomplete or rankings are empty.");
                }
              ' "$temp_dir/status.json" "$temp_dir/rankings.json"; then
                echo "Production service is healthy with hydrated FPL rankings."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}: production service is not ready yet (health HTTP ${health_status})."
            sleep 5
          done

          echo "Production service did not become healthy within three minutes."
          az webapp log startup show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${WEBAPP_NAME}" || true
          exit 1
