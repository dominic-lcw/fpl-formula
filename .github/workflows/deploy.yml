name: Deploy FPL Formula

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fpl-formula-production
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and lint checks
        run: |
          pnpm test
          pnpm lint

      - name: Hydrate FPL data
        run: pnpm hydrate

      - name: Build production package
        run: |
          pnpm build
          mkdir deployment
          cp package.json pnpm-lock.yaml next.config.ts deployment/
          pnpm --dir deployment install --prod --frozen-lockfile
          mkdir deployment/node_modules.runtime
          for dependency in deployment/node_modules/*; do
            cp -RL "$dependency" deployment/node_modules.runtime/
          done
          rm -rf deployment/node_modules
          mv deployment/node_modules.runtime deployment/node_modules
          cp -R .next deployment/.next
          if [ -d public ]; then cp -R public deployment/public; fi
          cp -R data deployment/data
          cd deployment
          zip -qr ../fpl-formula.zip .

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package to App Service
        run: >
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_WEBAPP_NAME }}"
          --src-path fpl-formula.zip
          --type zip
          --async false
